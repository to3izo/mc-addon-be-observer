name: Release

# Builds and packages the Add-On when a version tag (v1.2.3) is pushed or a
# GitHub Release is published, then attaches the .mcaddon/.mcpack files to the
# release. The tag must equal "v" + package.json version.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version (${expected}). Run: pnpm version:set <x.y.z>"
            exit 1
          fi

      - name: Validate
        run: pnpm validate

      - name: Package
        run: pnpm package

      - name: Test
        run: pnpm test

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-packages
          path: |
            dist/*.mcaddon
            dist/*.mcpack
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.mcaddon dist/*.mcpack --clobber
